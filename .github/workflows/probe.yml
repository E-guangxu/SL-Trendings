name: probe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 探测各推送服务连通性
        run: |
          {
            echo "# GitHub runner 出口连通性探测"
            echo ""
            echo "时间: $(date -u +%FT%TZ)"
            echo ""
            echo "| 目标 | HTTP | 耗时(s) |"
            echo "|---|---|---|"
            for u in \
              "https://qyapi.weixin.qq.com/cgi-bin/webhook/send" \
              "https://www.pushplus.plus/" \
              "https://sctapi.ftqq.com/" \
              "https://api.telegram.org" \
              "https://www.workbuddy.cn" ; do
              r=$(curl -s -o /dev/null -w "%{http_code}|%{time_total}" --max-time 15 "$u" 2>/dev/null || echo "FAIL|0")
              code="${r%%|*}"
              t="${r##*|}"
              echo "| $u | $code | $t |"
            done
            echo ""
            echo "## qyapi 返回体（无 key 时应是 JSON 错误码）"
            echo '```'
            curl -s --max-time 15 "https://qyapi.weixin.qq.com/cgi-bin/webhook/send" || echo "(无响应)"
            echo '```'
            echo ""
            echo "## pushplus 返回体"
            echo '```'
            curl -s --max-time 15 "https://www.pushplus.plus/send" | head -c 500 || echo "(无响应)"
            echo '```'
          } > probe-result.txt
          cat probe-result.txt

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-result.txt
          git commit -m "probe: 出口连通性" || true
          git push
