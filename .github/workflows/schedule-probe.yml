name: schedule-probe

# 用途：探测 GitHub 平台侧的 schedule 派发是否已恢复正常。
# 背景：2026-09-22 实测 schedule 完全零派发（社区讨论 #207211），
#       当时用最小工作流 */5 连续 35 分钟、7 个时间点，一次都没触发。
# 这个工作流只打印时间，不抓任何数据、不推送、不提交，长期挂着无副作用。
# 哪天 schedule 恢复，daily-hot.yml 里那三个 cron 就会自己生效。
on:
  schedule:
    # 高频档：探测「平台是否还会派发高频 cron」。
    # 实测 2026-09-23 11:12→15:07（约 4 小时、24 个应发时点）这个 */10
    # 一次都没被 schedule 触发 → 高频档实际处于被忽略/限流状态。
    - cron: '*/10 * * * *'
    # 常规档：每小时 :05。**这一档才是决定性的**——
    # daily-hot 用的是每天 3 次的常规 cron，所以只要这一档能发，
    # 就说明 daily-hot 可以自给自足，外部时钟降级为冗余备份。
    # 判读规则：
    #   常规档发 + 高频档不发 → 只是高频被限流，正常 cron 已恢复 ✅
    #   两档都不发           → 平台 cron 仍未恢复，三个时钟都得留着 ❌
    - cron: '5 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 记录本次派发
        run: |
          echo "event_name = ${{ github.event_name }}"
          echo "event.schedule = ${{ github.event.schedule }}"
          echo "run_number = ${{ github.run_number }}"
          date -u '+UTC   = %F %T'
          date -d '+8 hours' '+北京 = %F %T' 2>/dev/null || true
