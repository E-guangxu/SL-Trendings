name: daily-hot

on:
  schedule:
    # ⚠️ GitHub 的 cron 是「尽力而为」，不是精确调度：
    #    官方文档明确说整点（:00）属高负载时段，任务会被延迟，
    #    「如果负载足够高，部分排队任务会被直接丢弃」。
    #    而 00:00 UTC 恰好是全世界最拥挤的时段。
    # 因此这里做了两件事：
    #    1) 避开 :00，用 07 / 23 / 41 这种错峰分钟
    #    2) 同一小时内排三次互为备份；脚本里有「当天已跑过则跳过」的守卫，
    #       所以补上的那次不会重复推送、重复提交
    # ⚠️ 2026-09-22：GitHub 平台侧的 schedule 派发故障（社区讨论 #207211）。
    #    实测：最小 */5 工作流连续 14 分钟、3 个时间点、零次派发。
    #    下面这几个 cron 属于「写了不亏」——故障恢复后能自动生效。
    #    但**不要依赖它**：真正的时钟靠外部调度器打 workflow_dispatch API（见 README）。
    # UTC 00:07 = 北京 08:07
    - cron: '7 0 * * *'
    - cron: '23 0 * * *'
    - cron: '41 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略「今天已跑过」检查，强制重跑'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 触发信息（诊断用）
        run: |
          echo "event_name      = ${{ github.event_name }}"
          echo "event.schedule  = ${{ github.event.schedule }}"
          echo "inputs.force    = ${{ github.event.inputs.force }}"
          echo "run_number      = ${{ github.run_number }}"
          date -u '+现在(UTC)       = %F %T'

      - name: 抓取热榜
        env:
          # Server酱 SendKey，存在仓库 Secret 里；没配则自动跳过推送，不会报错
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # 定时触发时为空（走守卫）；手动触发时默认 true，便于强制重跑
          FORCE: ${{ github.event.inputs.force }}
        run: python scripts/hot.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: 每日热榜 $(date -u +%F)"
          fi
          git push

      # 让「静默失败」变成看得见的告警：任务出错时主动推一条微信，
      # 而不是等你发现今天没收到榜单。
      - name: 失败时微信告警
        if: failure()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python scripts/alert.py \
            "【任务失败】每日热榜" \
            "触发方式: ${{ github.event_name }} / 运行 #${{ github.run_number }}（${{ github.run_id }}）。请查看 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
