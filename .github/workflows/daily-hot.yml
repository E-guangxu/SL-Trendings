name: daily-hot

on:
  schedule:
    # ⚠️ GitHub 的 cron 是「尽力而为」，不是精确调度：
    #    官方文档明确说整点（:00）属高负载时段，任务会被延迟，
    #    「如果负载足够高，部分排队任务会被直接丢弃」。
    #    而 00:00 UTC 恰好是全世界最拥挤的时段。
    # 因此这里做了两件事：
    #    1) 避开 :00，用 07 / 23 / 41 这种错峰分钟
    #    2) 同一小时内排三次互为备份；脚本里有「当天已跑过则跳过」的守卫，
    #       所以补上的那次不会重复推送、重复提交
    # ⚠️ 2026-09-22：GitHub 平台侧的 schedule 派发故障（社区讨论 #207211）。
    #    实测：最小 */5 工作流连续 14 分钟、3 个时间点、零次派发。
    #    下面这几个 cron 属于「写了不亏」——故障恢复后能自动生效。
    #    但**不要依赖它**：真正的时钟靠外部调度器打 workflow_dispatch API（见 README）。
    # UTC 00:07 = 北京 08:07
    - cron: '7 0 * * *'
    - cron: '23 0 * * *'
    - cron: '41 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '忽略「今天已跑过」检查，强制重跑'
        type: boolean
        default: true
      topics:
        description: '指定话题（逗号分隔，可多个）。留空 = 用仓库里的 config/topics.txt；那里也留空 = 全站榜'
        type: string
        default: ''
      mode:
        description: 'daily=每天那次（受守卫约束，写当日文件）；adhoc=临时查询（不受守卫，只推送+归档到 data/adhoc）'
        type: choice
        options:
          - daily
          - adhoc
        default: daily
      keep_global:
        description: '话题模式下是否仍附带全站榜（Reddit r/all + YouTube 全球热门）。每日那次默认就是「全站榜 + 话题」'
        type: boolean
        default: true
      cn_hot:
        description: '是否附带中文圈热点（微博/抖音/B站/头条）。每日那次默认开'
        type: boolean
        default: true

permissions:
  contents: write

# ⚠️ 2026-09-23 新增：串行化，避免「多时钟同时开火」导致 git push 撞车。
# 背景：当天 11:00 与 11:04 两次运行重叠，后一次在「提交结果」步骤
# `git push` 被拒（remote 已被前一次推进）→ 运行 #15 记为 failure。
# 现在 GitHub 原生 cron 恢复后可能在补发时成批派发，重叠概率更高，必须串行。
# cancel-in-progress: false —— 排队而不是取消：每次运行都有意义（首个负责推送，
# 其余命中「当天已推送」守卫后快速退出），取消反而可能打断正在推送的那次。
concurrency:
  group: daily-hot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 触发信息（诊断用）
        run: |
          echo "event_name      = ${{ github.event_name }}"
          echo "event.schedule  = ${{ github.event.schedule }}"
          echo "inputs.force    = ${{ github.event.inputs.force }}"
          echo "inputs.topics   = ${{ github.event.inputs.topics }}"
          echo "inputs.mode     = ${{ github.event.inputs.mode }}"
          echo "inputs.keep_global = ${{ github.event.inputs.keep_global }}"
          echo "inputs.cn_hot   = ${{ github.event.inputs.cn_hot }}"
          echo "run_number      = ${{ github.run_number }}"
          date -u '+现在(UTC)       = %F %T'

      - name: 抓取热榜
        env:
          # Server酱 SendKey，存在仓库 Secret 里；没配则自动跳过推送，不会报错
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          # 定时触发时为空（走守卫）；手动触发时默认 true，便于强制重跑
          FORCE: ${{ github.event.inputs.force }}
          # 话题：手动触发填了就用填的，否则脚本去读 config/topics.txt
          TOPICS: ${{ github.event.inputs.topics }}
          # daily / adhoc（定时触发时为空 → 脚本按 daily 处理）
          MODE: ${{ github.event.inputs.mode }}
          # 「添加话题」而不是「换成话题」：话题模式下仍附带全站榜。
          # 定时触发时 inputs 为空 → 兜底 'true'，所以每日 = 全站榜 + 话题；
          # 手动触发时以勾选框为准（取消勾选才变 false）。
          KEEP_GLOBAL: ${{ github.event.inputs.keep_global || 'true' }}
          # 中文圈热点（微博/抖音/B站/头条）：每日那次默认开，手动触发可关。
          CN_HOT: ${{ github.event.inputs.cn_hot || 'true' }}
        run: python scripts/hot.py

      - name: 提交结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: 每日热榜 $(date -u +%F)"
          fi
          # 上面有 concurrency 串行化，理论上不会撞车；这里再兜一层：
          # 推之前先合远端（--autostash 防止未提交内容挡住 rebase），
          # 失败则重试 3 次，全部失败才算真失败（交给「失败时微信告警」）。
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "第 $i 次推送失败，2 秒后重试…"
            sleep 2
          done
          echo "::error::推送连续失败 3 次"
          exit 1

      # 让「静默失败」变成看得见的告警：任务出错时主动推一条微信，
      # 而不是等你发现今天没收到榜单。
      - name: 失败时微信告警
        if: failure()
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          python scripts/alert.py \
            "【任务失败】每日热榜" \
            "触发方式: ${{ github.event_name }} / 运行 #${{ github.run_number }}（${{ github.run_id }}）。请查看 https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
